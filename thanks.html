<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | StemsCare Services</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--teal-900:#163c35;--teal:#2a7468;--teal-50:#e9f2ef;--cream:#faf8f3;--muted:#55625e;--line:#e5ded1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);font-family:"Figtree",system-ui,sans-serif;color:var(--teal-900);padding:24px}
.card{max-width:560px;width:100%;background:#fff;border:1px solid var(--line);border-radius:24px;padding:48px 40px;text-align:center;box-shadow:0 18px 40px -12px rgba(20,50,44,.18)}
img{height:64px;width:auto;margin:0 auto 32px;display:block}
.tick{width:64px;height:64px;border-radius:50%;background:var(--teal-50);color:var(--teal);display:grid;place-items:center;margin:0 auto 24px}
h1{font-family:"Fraunces",Georgia,serif;font-size:38px;line-height:1.1;margin:0 0 14px}
p{color:var(--muted);font-size:17px;line-height:1.6;margin:0 0 28px}
a.btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;padding:15px 26px;border-radius:999px}
a.btn:hover{background:var(--teal-900)}
.call{display:block;margin-top:18px;color:var(--teal);font-weight:600}
</style>
</head>
<body>
<main class="card">
  <img src="logo.png" alt="StemsCare Services">
  <div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h1>Thanks — we've got your message.</h1>
  <p>One of our team will be in touch within one business day. If it's urgent, please give us a call.</p>
  <a class="btn" href="/">Back to home</a>
  <a class="call" href="tel:+61475212770">North Perth: call Kgomotso 0475 212 770</a>
  <a class="call" href="tel:+61459676429">South Perth: call Mwangala 0459 676 429</a>
</main>
</body>
</html>
